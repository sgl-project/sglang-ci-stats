name: Scrape

on:
  schedule:
    # every 6 hours
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      max_new_runs:
        description: "Cap on number of new runs to archive this invocation"
        required: false
        default: "50"
      force_derive:
        description: "Run derive.py + commit even if runs/ has no change"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_NEW_RUNS: ${{ github.event.inputs.max_new_runs || '50' }}
        run: python scrape.py --max-new-runs "$MAX_NEW_RUNS"

      - name: Check whether to derive
        id: changes
        run: |
          # Derive when:
          #   - scrape produced new/augmented runs/  (normal path), OR
          #   - models/ is empty / missing            (bootstrap), OR
          #   - --force-derive was requested manually (workflow_dispatch)
          should=false
          reason=""
          if [[ -n "$(git status --porcelain runs/)" ]]; then
            should=true
            reason="runs/ changed"
          elif [[ ! -d models ]] || [[ -z "$(ls -A models/ 2>/dev/null)" ]]; then
            should=true
            reason="models/ bootstrap"
          elif [[ "${{ github.event.inputs.force_derive }}" == "true" ]]; then
            should=true
            reason="force_derive=true"
          fi
          if [[ "$should" == "true" ]]; then
            echo "should=true" >> "$GITHUB_OUTPUT"
            echo "deriving: $reason"
          else
            echo "should=false" >> "$GITHUB_OUTPUT"
            echo "skipping derive + commit (no changes)"
          fi

      - name: Derive partition model
        if: steps.changes.outputs.should == 'true'
        run: python derive.py

      - name: Commit and push
        if: steps.changes.outputs.should == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/ models/
          git commit -m "scrape+derive: $(date -u +%FT%TZ)"
          git push
