name: Scrape

on:
  schedule:
    # every 6 hours
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      max_new_runs:
        description: "Cap on number of new runs to archive this invocation"
        required: false
        default: "50"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_NEW_RUNS: ${{ github.event.inputs.max_new_runs || '50' }}
        run: python scrape.py --max-new-runs "$MAX_NEW_RUNS"

      - name: Check runs/ for changes
        id: changes
        run: |
          if [[ -z "$(git status --porcelain runs/)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "runs/ unchanged -> skipping derive + commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive partition model
        if: steps.changes.outputs.changed == 'true'
        run: python derive.py

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/ models/
          git commit -m "scrape+derive: $(date -u +%FT%TZ)"
          git push
