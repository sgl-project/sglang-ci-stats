name: Scrape

on:
  schedule:
    # every 6 hours
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      max_new_runs:
        description: "Cap on number of new runs to archive this invocation"
        required: false
        default: "50"
      lookback_hours:
        description: "Rolling window of run start times to consider"
        required: false
        default: "48"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_NEW_RUNS: ${{ github.event.inputs.max_new_runs || '50' }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '48' }}
        run: python scrape.py --max-new-runs "$MAX_NEW_RUNS" --lookback-hours "$LOOKBACK_HOURS"

      - name: Derive partition model
        run: python derive.py

      - name: Commit and push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/ model.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "scrape+derive: $(date -u +%FT%TZ)"
            git push
          fi

  # Render demo.html from the freshly-scraped runs/ and publish to Pages.
  # Runs even if scrape failed (if: always()) so a transient scrape error
  # leaves the last good page up rather than blocking redeploys. Checks out
  # ref: main to pick up the commit the scrape job just pushed -- the default
  # checkout would see the pre-scrape SHA the run was triggered at.
  deploy-pages:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render demo.html
        run: python demo.py --out public/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
        id: deployment
